name: MobileGlues

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch C++ dependencies
        run: |
          cd MobileGlues
          git clone --depth 1 https://github.com/stbrumme/xxhash.git MobileGlues-cpp/3rdparty/xxhash
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git MobileGlues-cpp/3rdparty/glslang
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git MobileGlues-cpp/3rdparty/SPIRV-Cross
          git clone --depth 1 https://github.com/MobileGL-Dev/flat_hash_map.git MobileGlues-cpp/include/ska
          git clone --depth 1 https://android.googlesource.com/platform/external/perfetto MobileGlues-cpp/3rdparty/perfetto

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Fetch keystore
        run: |
          git clone --depth 1 https://${{ secrets.KEYSTORE_REPO_TOKEN }}@github.com/isaquxet08-ai/MGCE-Keystore.git /tmp/ks
          cp /tmp/ks/my-release-key.jks keystore.jks

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "MGCE-dbg-build${{ github.run_number }}.apk"
          done
          ls -lh

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}_${{ env.date_today }}_${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MGCE Debug Build #${{ github.run_number }}"
          body: |
            ## MGCE Debug Build

            **Build Number**: #${{ github.run_number }}
            **Date**: ${{ env.date_today }}
            **Commit**: `${{ github.sha }}`
            **Branch**: `${{ github.ref_name }}`

            ### About this build
            This is an automatically built debug version of MobileGlues CE.
            - Package: `com.fcl.plugin.mobileglues.dbg`
            - Signed with MGCE debug keystore
            - For testing purposes only

            本版本为自动构建的调试版本，仅供测试使用。

            ### Installation
            1. Uninstall any previous MGCE version
            2. Install this APK
            3. Enable in FCL plugin manager
            4. Select as renderer for Minecraft 26.3+

            ### Known Issues
            - Terrain blocks may not render correctly on Mali GPUs
            - See repository README for details
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
