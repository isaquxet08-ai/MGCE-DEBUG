name: MobileGlues

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Release stage (dbg / ala / bta / rel)'
        required: true
        default: 'dbg'
        type: choice
        options:
          - dbg
          - ala
          - bta
          - rel
      publish:
        description: 'Publish to Releases? (no=private artifact, yes=public release)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch C++ dependencies
        run: |
          cd MobileGlues
          git clone --depth 1 https://github.com/stbrumme/xxhash.git MobileGlues-cpp/3rdparty/xxhash
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git MobileGlues-cpp/3rdparty/glslang
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git MobileGlues-cpp/3rdparty/SPIRV-Cross
          git clone --depth 1 https://github.com/MobileGL-Dev/flat_hash_map.git MobileGlues-cpp/include/ska
          git clone --depth 1 https://android.googlesource.com/platform/external/perfetto MobileGlues-cpp/3rdparty/perfetto

      - name: Fetch prebuilt vkshim.so from MGCE-Builds
        run: |
          git clone --depth 1 https://github.com/isaquxet08-ai/MGCE-Builds.git /tmp/builds
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/builds/lib/arm64-v8a/libvkshim.so app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/libvkshim.so

      - name: Read build number
        id: ver
        run: |
          if [ -f btv.txt ]; then
            BUILD=$(cat btv.txt | tr -d '[:space:]')
          else
            BUILD=1
          fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $BUILD"

      - name: Determine stage
        id: stage
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "Selected stage: $STAGE"

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Fetch keystore
        run: |
          git clone --depth 1 https://${{ secrets.KEYSTORE_REPO_TOKEN }}@github.com/isaquxet08-ai/MGCE-Keystore.git /tmp/ks
          cp /tmp/ks/my-release-key.jks keystore.jks

      - name: Select icon version
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          cd app/src/main/res/mipmap-anydpi-v26
          sed -i "s|@mipmap/ic_launcher_foreground[a-z_]*\"|@mipmap/ic_launcher_foreground_${STAGE}\"|" ic_launcher.xml ic_launcher_round.xml
          echo "=== ic_launcher.xml ==="
          cat ic_launcher.xml

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          BUILD_STAGE: ${{ steps.stage.outputs.stage }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK contains libvkshim.so
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -i "vkshim" || echo "WARNING: libvkshim.so NOT in APK"

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "MGCE-${{ steps.stage.outputs.stage }}-build${{ steps.ver.outputs.build }}.apk"
          done
          ls -lh

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGCE-${{ steps.stage.outputs.stage }}-${{ env.date_today }}-b${{ steps.ver.outputs.build }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.event.inputs.publish == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.stage }}-build-${{ steps.ver.outputs.build }}
          name: "MGCE ${{ steps.stage.outputs.stage }} - Build #${{ steps.ver.outputs.build }} (${{ env.date_today }})"
          body: |
            ## MobileGlues CE - ${{ steps.stage.outputs.stage }} Build #${{ steps.ver.outputs.build }}

            **Date**: ${{ env.date_today }}
            **Commit**: ${{ github.sha }}
            **Package**: com.fcl.plugin.mobileglues.${{ steps.stage.outputs.stage }}

            ### Read before installing

            Experimental build. Transparent blocks (water, glass, ice)
            may render incorrectly on some Mali GPUs.

            ### Requirements

            1. FCL 1.3.3.7+
            2. Set OpenGL Error Setting to "Ignore shader/program/framebuffer error"
            3. Delete cached shaders before first launch

            ### Installation

            1. Uninstall previous MGCE/MobileGlues
            2. Install this APK
            3. In FCL: Version Settings -> Renderer -> select MobileGlues CE

            ### Reporting

            Include device model, GPU, screenshot, and /sdcard/MG/latest.log

            ### Credits

            - MobileGlues: https://github.com/MobileGL-Dev/MobileGlues
            - vkshim: https://github.com/FCL-Team/FoldCraftLauncher
            - CE integration: https://github.com/isaquxet08-ai

            ---

            Official source: https://github.com/isaquxet08-ai/MGCE-DEBUG
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        if: success()
        run: |
          NEXT=$(( ${{ steps.ver.outputs.build }} + 1 ))
          echo "$NEXT" > btv.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btv.txt
          git commit -m "chore: bump build number to $NEXT [skip ci]" || echo "no changes"
          git push || echo "push skipped"
