name: MobileGlues

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      stage:
        description: 'Release stage (dbg / ala / bta / rel)'
        required: true
        default: 'dbg'
        type: choice
        options:
          - dbg
          - ala
          - bta
          - rel

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch C++ dependencies
        run: |
          cd MobileGlues
          git clone --depth 1 https://github.com/stbrumme/xxhash.git MobileGlues-cpp/3rdparty/xxhash
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git MobileGlues-cpp/3rdparty/glslang
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git MobileGlues-cpp/3rdparty/SPIRV-Cross
          git clone --depth 1 https://github.com/MobileGL-Dev/flat_hash_map.git MobileGlues-cpp/include/ska
          git clone --depth 1 https://android.googlesource.com/platform/external/perfetto MobileGlues-cpp/3rdparty/perfetto

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            STAGE="rel"
          else
            STAGE="dbg"
          fi
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "Selected stage: $STAGE"

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> local.properties

      - name: Fetch keystore
        run: |
          git clone --depth 1 https://${{ secrets.KEYSTORE_REPO_TOKEN }}@github.com/isaquxet08-ai/MGCE-Keystore.git /tmp/ks
          cp /tmp/ks/my-release-key.jks keystore.jks

      - name: Select icon version
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          cd app/src/main/res/mipmap-anydpi-v26
          sed -i "s|@mipmap/ic_launcher_foreground[a-z_]*\"|@mipmap/ic_launcher_foreground_${STAGE}\"|" ic_launcher.xml ic_launcher_round.xml
          echo "=== ic_launcher.xml ==="
          cat ic_launcher.xml
          echo ""
          echo "=== ic_launcher_round.xml ==="
          cat ic_launcher_round.xml

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build apk
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "MGCE-${{ steps.stage.outputs.stage }}-build${{ github.run_number }}.apk"
          done
          ls -lh

      - name: Upload apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGCE-${{ steps.stage.outputs.stage }}-${{ env.date_today }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.stage }}-build-${{ github.run_number }}
          name: "MGCE ${{ steps.stage.outputs.stage }} Build #${{ github.run_number }}"
          body: |
            ## MGCE ${{ steps.stage.outputs.stage }} Build

            - **Stage**: ${{ steps.stage.outputs.stage }}
            - **Build**: #${{ github.run_number }}
            - **Date**: ${{ env.date_today }}
            - **Commit**: ${{ github.sha }}

            Auto-built from GitHub Actions.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
